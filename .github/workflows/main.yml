name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PDFEditor-Electron      # <- your folder name
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PDFEditor-Electron/package-lock.json    # <- your folder name

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-Windows
          path: PDFEditor-Electron/dist/*.exe         # <- your folder name
          if-no-files-found: error

      - name: Check install and "Open with" registration
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'PDFEditor-Setup-*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          Get-Process PDFEditor -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter PDFEditor.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'PDFEditor.exe was not installed' }
          $ids = (Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids').PSObject.Properties.Name
          if ($ids -notcontains 'PDFEditor.AssocPDF') { throw 'PDF Editor is not listed under Open with' }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\Applications\PDFEditor.exe\shell\open\command').'(default)'
          Write-Host "Installed: $($exe.FullName)"
          Write-Host "Open with command: $cmd"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PDFEditor-Electron/dist/*.exe        # <- your folder name
          generate_release_notes: true
